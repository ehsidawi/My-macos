services:
  omarchy:
    build: .
    image: ghcr.io/ehsidawi/my-macos:edge
    container_name: omarchy
    environment:
      BOOT: "https://iso.omarchy.org/omarchy-4.0.4.iso"
      RAM_SIZE: "${RAM_SIZE:-8G}"
      CPU_CORES: "${CPU_CORES:-4}"
      DISK_SIZE: "${DISK_SIZE:-128G}"
      BOOT_MODE: "uefi"
      TPM: "N"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
    volumes:
      - ./omarchy:/storage
    restart: unless-stopped
    stop_grace_period: 2m
